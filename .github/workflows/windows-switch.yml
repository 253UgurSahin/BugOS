---
# De Windows-overstap nakijken en inpakken als zip om te downloaden.
name: Windows-overstap

# Alleen met de hand starten (Actions > Run workflow): automatisch draaien gaf elke keer een mail.
# Weer automatisch? Haal de # weg bij de regels hieronder.
on:
#  push:
#    branches: ["**"]
#    paths: ["windows-switch/**", ".github/workflows/windows-switch.yml"]
#    tags: ["v*"]
#  pull_request:
#    paths: ["windows-switch/**"]
  workflow_dispatch:
    inputs:
      plaatjes_vastleggen:
        description: "Plaatjes van het venster in de repo zetten (docs/images/switch)"
        type: boolean
        default: false

jobs:
  controle:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Script nakijken (geen tikfouten)
        shell: powershell
        run: |
          $fouten = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\windows-switch\BugOS-Switch.ps1", [ref]$null, [ref]$fouten) | Out-Null
          if ($fouten) { $fouten | Format-List; exit 1 }
          Write-Host "Geen tikfouten gevonden."

      - name: Script nakijken (PSScriptAnalyzer)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path windows-switch\BugOS-Switch.ps1 -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

      - name: Controle-stap proberen (alleen lezen, verandert niets)
        shell: powershell
        run: |
          # Laad alleen de functies (zonder venster) en draai de pc-controle.
          $code = Get-Content windows-switch\BugOS-Switch.ps1 -Raw -Encoding UTF8
          $tot = $code.IndexOf('# ==================================================== beheerder-taken')
          $param = $code.IndexOf('Set-StrictMode')
          . ([scriptblock]::Create($code.Substring($param, $tot - $param)))
          Get-Controle | Format-Table -AutoSize -Wrap
          "Meeneem-grootte: {0:N1} GB" -f ((Get-MeeneemGrootte) / 1GB)
          "Soort voor deze pc: $(Get-IsoSoort)"
          try { $gevonden = Get-IsoInfo 'main' } catch { "Downloads nog niet bereikbaar (repo is privé): $($_.Exception.Message)"; $gevonden = $null }
          if ($gevonden) { "Nieuwste ISO: $($gevonden.Versie) - $($gevonden.Info.delen.Count) stukjes" } else { "Nog geen ISO-release gevonden (dat is goed zolang er nog niets gepubliceerd is)." }

      - name: Venster nakijken (plaatjes van elke pagina, 100% en 150%)
        shell: powershell
        timeout-minutes: 5
        run: |
          foreach ($schaal in @('1', '1.5')) {
            $map = "$PWD\fotos\schaal-$schaal"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows-switch\BugOS-Switch.ps1 -Taak Foto -Taal nl -FotoSchaal $schaal -FotoMap $map
            if ($LASTEXITCODE -ne 0) { Write-Host "Het venster gaf een fout (schaal $schaal)."; exit 1 }
          }
          Get-ChildItem fotos -Recurse -File | Format-Table FullName, Length -AutoSize

      - name: Plaatjes in de repo zetten (alleen als je daarom vraagt)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.plaatjes_vastleggen }}
        shell: powershell
        run: |
          $doel = 'docs\beelden\overstap'
          New-Item -ItemType Directory -Force $doel | Out-Null
          Copy-Item fotos\schaal-1\overstap-*.png $doel -Force
          Copy-Item fotos\schaal-1.5\switch-1.png (Join-Path $doel 'switch-1-150percent.png') -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $doel
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Plaatjes van BugOS Overstap (gemaakt op Windows)"
            git push origin "HEAD:$env:GITHUB_REF_NAME"   # via env, niet in de opdracht geplakt (U249)
          } else { Write-Output 'Geen veranderingen.' }

      - name: Plaatjes bewaren
        uses: actions/upload-artifact@v4
        with:
          name: Overstap-plaatjes
          path: fotos/

      - name: Inpakken
        uses: actions/upload-artifact@v4
        with:
          name: BugOS-Switch
          path: |
            windows-switch/BugOS-Switch.ps1
            windows-switch/Start BugOS Switch.bat
            windows-switch/README.txt

      - name: Zip maken voor een release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: Compress-Archive -Path windows-switch\* -DestinationPath BugOS-Switch.zip

      - name: Release maken (bij een versie-tag zoals v0.2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: BugOS-Switch.zip
          generate_release_notes: true
