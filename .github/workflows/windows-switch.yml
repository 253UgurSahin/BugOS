---
# De Windows-overstap nakijken en inpakken als zip om te downloaden.
name: Windows-overstap

# Alleen met de hand starten (Actions > Run workflow): automatisch draaien gaf elke keer een mail.
# Weer automatisch? Haal de # weg bij de regels hieronder.
on:
#  push:
#    branches: ["**"]
#    paths: ["windows-switch/**", ".github/workflows/windows-switch.yml"]
#    tags: ["v*"]
#  pull_request:
#    paths: ["windows-switch/**"]
  workflow_dispatch:
    inputs:
      plaatjes_vastleggen:
        description: "Plaatjes van het venster in de repo zetten (docs/images/switch)"
        type: boolean
        default: false

jobs:
  controle:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Script nakijken (geen tikfouten)
        shell: powershell
        run: |
          $fouten = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\windows-switch\BugOS-Switch.ps1", [ref]$null, [ref]$fouten) | Out-Null
          if ($fouten) { $fouten | Format-List; exit 1 }
          Write-Host "Geen tikfouten gevonden."

      - name: Script nakijken (PSScriptAnalyzer)
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path windows-switch\BugOS-Switch.ps1 -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }

      - name: Controle-stap proberen (alleen lezen, verandert niets)
        shell: powershell
        run: |
          # Laad alleen de functies (zonder venster) en draai de pc-controle.
          $code = Get-Content windows-switch\BugOS-Switch.ps1 -Raw -Encoding UTF8
          $tot = $code.IndexOf('# ==================================================== beheerder-taken')
          $param = $code.IndexOf('Set-StrictMode')
          . ([scriptblock]::Create($code.Substring($param, $tot - $param)))
          Get-Controle | Format-Table -AutoSize -Wrap
          "Meeneem-grootte: {0:N1} GB" -f ((Get-MeeneemGrootte) / 1GB)
          "Soort voor deze pc: $(Get-IsoSoort)"
          try { $gevonden = Get-IsoInfo 'main' } catch { "Downloads nog niet bereikbaar (repo is privé): $($_.Exception.Message)"; $gevonden = $null }
          if ($gevonden) { "Nieuwste ISO: $($gevonden.Versie) - $($gevonden.Info.delen.Count) stukjes" } else { "Nog geen ISO-release gevonden (dat is goed zolang er nog niets gepubliceerd is)." }
          # Formaat 2 (FORMAT.md): alleen lezen. Een runner heeft geen wifi en vaak geen printers: een lege lijst is goed,
          # een fout (een tikfout in de functie) laat de stap mislukken. Nooit wachtwoorden: daar vraagt niets om.
          "Instellingen:"; Get-Instellingen | ConvertTo-Json -Depth 4
          $wifi = @(Get-WifiNetwerken); "Wifi-netwerken (alleen namen): $($wifi.Count)"
          try { $printers = @(Get-NetwerkPrinters); "Netwerkprinters: $($printers.Count)" } catch { "Printers niet te lezen (printerdienst uit?): $($_.Exception.Message)" }
          $programmas = @(Get-Programmas); "Programma's: $($programmas.Count)"; $programmas | Select-Object -First 5 | ForEach-Object { "  $($_.naam) ($($_.versie))" }
          "Browserprofielen: $(@(Get-ChromiumProfielen).Count) Chromium, $(@(Get-FirefoxProfielen).Count) Firefox"
          # GitHub sluit deze stap af met 'exit $LASTEXITCODE'. Op een runner zonder wifi laat netsh (Get-WifiNetwerken)
          # code 1 achter, ook al ging alles goed (de lijst is dan gewoon leeg). Fouten hierboven stoppen de stap zelf al.
          $global:LASTEXITCODE = 0

      # Wat je niet op een plaatje ziet: het werk loopt naast het venster (het venster blijft bewegen), fouten komen netjes
      # terug, de ISO wordt zelf gelezen (zonder Joliet, zoals de echte), en de stick wordt op een nep-stick (een VHD)
      # bruikbaar gemaakt (exFAT BUGOS + verborgen opstartdeel) en weer gewoon gemaakt, als beheerder-taak.
      - name: Zelftest (werk naast het venster, ISO lezen, stick maken en weer gewoon maken op een nep-stick)
        shell: powershell
        timeout-minutes: 20
        run: |
          python -m pip install --quiet pycdlib
          python tools\switch_test_iso.py "$env:RUNNER_TEMP\bugos-test.iso"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $vhd = "$env:RUNNER_TEMP\nepstick.vhdx"
          "create vdisk file=`"$vhd`" maximum=1024 type=expandable`r`nattach vdisk`r`n" | Set-Content -Encoding ASCII "$env:RUNNER_TEMP\vhd-aan.txt"
          diskpart /s "$env:RUNNER_TEMP\vhd-aan.txt"
          Start-Sleep -Seconds 3
          $schijf = Get-Disk | Where-Object { "$($_.Location)" -like '*nepstick.vhdx*' } | Select-Object -First 1
          if (-not $schijf) { Get-Disk | Format-Table Number, FriendlyName, BusType, Location -AutoSize; exit 1 }
          "Nep-stick: schijf $($schijf.Number), $($schijf.BusType)"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows-switch\BugOS-Switch.ps1 -Taak Zelftest -Taal nl -IsoPad "$env:RUNNER_TEMP\bugos-test.iso" -SchijfNummer $schijf.Number
          $code = $LASTEXITCODE
          "select vdisk file=`"$vhd`"`r`ndetach vdisk`r`n" | Set-Content -Encoding ASCII "$env:RUNNER_TEMP\vhd-uit.txt"
          diskpart /s "$env:RUNNER_TEMP\vhd-uit.txt" | Out-Null
          exit $code

      - name: Venster nakijken (plaatjes van elke pagina, 100% en 150%)
        shell: powershell
        timeout-minutes: 5
        run: |
          foreach ($schaal in @('1', '1.5')) {
            $map = "$PWD\fotos\schaal-$schaal"
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows-switch\BugOS-Switch.ps1 -Taak Foto -Taal nl -FotoSchaal $schaal -FotoMap $map
            if ($LASTEXITCODE -ne 0) { Write-Host "Het venster gaf een fout (schaal $schaal)."; exit 1 }
          }
          Get-ChildItem fotos -Recurse -File | Format-Table FullName, Length -AutoSize

      - name: Plaatjes in de repo zetten (alleen als je daarom vraagt)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.plaatjes_vastleggen }}
        shell: powershell
        run: |
          # De plek en namen die README.md gebruikt (docs/images/switch/switch-N.png) (U359).
          $doel = 'docs\images\switch'
          New-Item -ItemType Directory -Force $doel | Out-Null
          Get-ChildItem fotos\schaal-1\overstap-*.png | ForEach-Object { Copy-Item $_.FullName (Join-Path $doel ($_.Name -replace '^overstap-', 'switch-')) -Force }
          Copy-Item fotos\schaal-1.5\overstap-1.png (Join-Path $doel 'switch-1-150percent.png') -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $doel
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Plaatjes van BugOS Overstap (gemaakt op Windows)"
            git push origin "HEAD:$env:GITHUB_REF_NAME"   # via env, niet in de opdracht geplakt (U249)
          } else { Write-Output 'Geen veranderingen.' }

      - name: Plaatjes bewaren
        uses: actions/upload-artifact@v4
        with:
          name: Overstap-plaatjes
          path: fotos/

      - name: Inpakken
        uses: actions/upload-artifact@v4
        with:
          name: BugOS-Switch
          path: |
            windows-switch/BugOS-Switch.ps1
            windows-switch/Start BugOS Switch.bat
            windows-switch/README.txt

      - name: Zip maken voor een release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        run: Compress-Archive -Path windows-switch\* -DestinationPath BugOS-Switch.zip

      - name: Release maken (bij een versie-tag zoals v0.2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: BugOS-Switch.zip
          generate_release_notes: true
