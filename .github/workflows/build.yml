---
# BugOS bouwen
# Jip-en-Janneke: elke week (en als je het met de hand start) bouwt GitHub een
# nieuwe BugOS. Computers met BugOS halen die vanzelf op als update.
name: BugOS bouwen

# Met de hand starten kan altijd (Actions > Build > Run workflow).
# Eén keer per week bouwt GitHub vanzelf, zodat beveiligingsupdates van Fedora bij de computers
# komen; zonder dat blijven ze bij GitHub hangen (A031). Te veel mail? Zet in GitHub bij
# Settings > Notifications > Actions "Only notify for failed workflows" aan.
# Bij elke verandering bouwen? Haal de # weg bij push en pull_request.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1" # elke maandagnacht
#  push:
#    branches: [main, "claude/**"]
#    paths-ignore: ["**.md", "docs/**", "tools/screenshots/**", ".github/workflows/screenshots.yml"]
#  pull_request:
#    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controle:
    name: Scripts controleren
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Shell-scripts nakijken (shellcheck)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -x build_files/build.sh \
            system_files/usr/share/bugos/lib.sh tools/screenshots/*.sh \
            $(grep -l '^#!/usr/bin/bash' system_files/usr/bin/bugos-*)
      - name: Python nakijken
        run: |
          python3 -m py_compile system_files/usr/lib/bugos/python/*.py iso_live/src/bugos-live \
            $(grep -l '^#!/usr/bin/python3' system_files/usr/bin/bugos-*)
          shellcheck -x iso_live/src/build.sh iso_live/src/bugos-install tools/iso-local.sh system_files/usr/bin/bugos-panel

      - name: Ontwerptaal is bijgewerkt (pictogrammen, Kvantum, GTK, Terminal en Wine gemaakt met hun makers)
        run: |
          python3 tools/icons/make.py
          if [ -f tools/kvantum/make.py ]; then python3 tools/kvantum/make.py; fi
          python3 tools/design/make_qml.py --check
          for m in tools/plasma/surfaces.py tools/plasma/buttons.py tools/gtk/make.py tools/konsole/make.py tools/wine/make.py; do python3 "$m"; done
          ANDERS="$(git status --porcelain -- system_files/usr/share/icons/BugOS system_files/usr/share/Kvantum system_files/usr/share/plasma/desktoptheme/bugos system_files/usr/share/color-schemes tools/icons/lists system_files/usr/share/bugos/gtk system_files/usr/share/bugos/wine system_files/usr/share/konsole)"
          if [ -n "$ANDERS" ]; then
            echo "$ANDERS" | head -20
            echo "Draai de makers (tools/icons, kvantum, plasma, gtk, konsole, wine: make.py) en zet het resultaat in de repo."
            exit 1
          fi

      - name: GTK leest de BugOS-laag zonder fouten (GTK 3 en 4)
        run: |
          sudo apt-get install -y -qq gir1.2-gtk-3.0 gir1.2-gtk-4.0 python3-gi >/dev/null
          /usr/bin/python3 tools/gtk/preview.py --check

      - name: Website is bijgewerkt (gebouwd uit tools/website/page.html)
        run: |
          python3 tools/website/build.py
          git diff --exit-code website/index.html || { echo "Draai: python3 tools/website/build.py"; exit 1; }

      - name: Menu's (QML) laden zonder Plasma
        run: |
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 >/dev/null
          pip install -q PySide6-Essentials
          QT_QPA_PLATFORM=offscreen python3 tools/qml-test.py

      - name: Bestanden testen (veilig weggooien, terugzetten, kopiëren)
        run: QT_QPA_PLATFORM=offscreen python3 tools/test_files.py
      - name: Taakbeheer testen (meten, groeperen, opstarten; met een nep-/proc)
        run: QT_QPA_PLATFORM=offscreen python3 tools/test_task_manager.py
      - name: Instellingen testen (wifi, bluetooth, geluid, scherm lezen; elke pagina opent)
        run: QT_QPA_PLATFORM=offscreen python3 tools/test_settings.py
      - name: Startmenu-gegevens testen (apps, instellingen zoeken, snelmenu-status; met nep-programma's)
        run: python3 tools/test_start_data.py
      - name: Pakket installeren testen (rare bestandsnamen voeren niets uit; met nep-programma's)
        run: bash tools/test_package.sh
      - name: Game-modus testen (twee keer aan, dan uit zet alles terug; met nep-programma's)
        run: bash tools/test_game_mode.sh
      - name: Lichte stand testen (uit zet je eigen instellingen terug; met nep-programma's)
        run: bash tools/test_light_mode.sh
      - name: Taakbalk instellen testen (lukt het niet, dan volgende keer opnieuw; met nep-programma's)
        run: bash tools/test_panel.sh
      - name: Windows-programma openen testen (rare namen, mislukte Wine-start; met nep-programma's)
        run: bash tools/test_exe.sh
      - name: Windows-overstap testen (het startbestand opent een script dat bestaat)
        run: bash tools/test_windows_start.sh
      - name: "'Er werkt iets niet' testen (nakijken en repareren op de achtergrond)"
        run: QT_QPA_PLATFORM=offscreen python3 tools/test_help.py
      - name: Overstappen op ondertekende updates testen (met een nep-rpm-ostree)
        run: bash tools/test_signed.sh
      - name: Back-up testen (ruimte, maken en terugzetten; met tijdelijke mappen)
        run: python3 tools/test_backup.py
      - name: Uitzetscherm testen (laadt het, en kloppen de knoppen per situatie)
        run: |
          if [ -f tools/test_logout.py ]; then
            QT_QPA_PLATFORM=offscreen python3 tools/test_logout.py
          else
            echo "Nog geen test voor het uitzetscherm."
          fi

  bouwen:
    name: BugOS ${{ matrix.variant }}
    needs: controle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      HEEFT_SLEUTEL: ${{ secrets.SIGNING_SECRET != '' && 'ja' || 'nee' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: main
            image: bugos
            base: ghcr.io/ublue-os/kinoite-main:44
          - variant: nvidia
            image: bugos-nvidia
            base: ghcr.io/ublue-os/kinoite-nvidia:44
    steps:
      - uses: actions/checkout@v4

      - name: Ruimte maken op de bouwcomputer
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Namen en labels bepalen
        id: meta
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          VERSIE="$(date -u +%Y.%m.%d)"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAGS="latest ${VERSIE}"
          else
            TAGS="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr '[:upper:]' '[:lower:]')"
          fi
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "versie=${VERSIE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Bouwen
        run: |
          sudo podman build \
            --build-arg BASE_IMAGE=${{ matrix.base }} \
            --build-arg BUGOS_VARIANT=${{ matrix.variant }} \
            --build-arg BUGOS_VERSION=${{ steps.meta.outputs.versie }} \
            --label org.opencontainers.image.title="BugOS" \
            --label org.opencontainers.image.description="BugOS: Linux as easy as Windows" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.licenses="GPL-3.0-or-later" \
            --label containers.bootc=1 \
            -t localhost/${{ matrix.image }}:build .

      - name: Uploaden naar GitHub Packages
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in ${TAGS}; do
            sudo podman push --digestfile /tmp/digest localhost/${{ matrix.image }}:build "${REGISTRY}/${{ matrix.image }}:${tag}"
          done
          echo "DIGEST=$(cat /tmp/digest)" >> "$GITHUB_ENV"

      # Ondertekenen: computers met BugOS installeren alleen een update met deze handtekening
      # (zie build_files/system.sh, "Ondertekende updates"). De sleutel staat als geheim in GitHub
      # (SIGNING_SECRET, gemaakt met "cosign generate-key-pair"); zonder dat geheim slaan we dit over.
      - name: Ondertekenen hulpmiddel (cosign)
        if: github.event_name != 'pull_request' && env.HEEFT_SLEUTEL == 'ja'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Ondertekenen
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.meta.outputs.registry }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "::warning::Geen SIGNING_SECRET: deze BugOS is niet ondertekend. Zie docs/ONDERTEKENEN.md."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign -y --key env://COSIGN_PRIVATE_KEY "${REGISTRY}/${{ matrix.image }}@${DIGEST}"
