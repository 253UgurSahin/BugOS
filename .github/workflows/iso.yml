---
# BugOS USB-stick maken (ISO)
# Druk in GitHub op "Actions" -> "BugOS ISO maken" -> "Run workflow".
#
#   soort = live      -> "Probeer eerst"-stick: BugOS start meteen op, met een
#                        knop "BugOS installeren" (aangeraden). BugOS zelf zit
#                        op de stick, dus installeren werkt ook zonder internet.
#   soort = klassiek  -> alleen het installatieprogramma, werkt zonder internet
#
#   publiceren = aan  -> de ISO komt als download in een GitHub Release.
#                        GitHub staat maar 2 GB per bestand toe, dus de ISO
#                        wordt in stukjes geknipt. BugOS Overstap (Windows)
#                        plakt ze vanzelf weer aan elkaar.
name: BugOS ISO maken

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Welke versie?"
        required: true
        default: bugos
        type: choice
        options: [bugos, bugos-nvidia]
      tag:
        description: "Welke bouw (latest = hoofdversie, of de branchnaam met - in plaats van /)"
        required: true
        default: latest
      soort:
        description: "Soort stick"
        required: true
        default: live
        type: choice
        options: [live, klassiek]
      publiceren:
        description: "Als download publiceren (GitHub Release)"
        required: false
        default: false
        type: boolean

jobs:
  live:
    if: inputs.soort == 'live'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Ruimte maken op de bouwcomputer
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true
          extra-squeeze: true

      # BugOS zit nu zelf in de live-omgeving (om vanaf de stick te installeren).
      # Het opslaan van die bouwstap kost tijdelijk een veelvoud van ~11 GB, meer
      # dan de bouwcomputer vrij heeft. Daarom (net als Bazzite) een "opgeblazen"
      # schijfbestand met btrfs en zstd-compressie: neemt alleen echte ruimte in
      # voor wat erop staat, en dat wordt ook nog ingepakt.
      - name: Container-opslag op een gecomprimeerde schijf (/mnt)
        run: |
          df -h / /mnt
          # mkfs.btrfs zit niet altijd op de bouwcomputer.
          command -v mkfs.btrfs >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq btrfs-progs; }
          sudo truncate -s 110G /mnt/bugos-podman.img
          sudo mkfs.btrfs -q -f -m single -d single /mnt/bugos-podman.img
          LOOP="$(sudo losetup --find --show --direct-io=on /mnt/bugos-podman.img)"
          sudo mkdir -p /mnt/containers
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/containers
          sudo mkdir -p /mnt/containers/storage /mnt/containers/tmp
          printf '[storage]\ndriver = "overlay"\ngraphroot = "/mnt/containers/storage"\nrunroot = "/run/containers/storage"\n' | sudo tee /etc/containers/storage.conf
          echo "TMPDIR=/mnt/containers/tmp" >> "$GITHUB_ENV"
          sudo podman info --format '{{ .Store.GraphRoot }}'
          df -h / /mnt /mnt/containers

      - name: Namen bepalen
        id: naam
        # De invoer via env: in plaats van ${{ }} in het script, zodat een rare waarde geen opdracht wordt (A035).
        env:
          VARIANT: ${{ inputs.variant }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::Geen geldige bouw: $TAG"; exit 1; }
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${VARIANT}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "datum=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"
          if [ "$VARIANT" = bugos-nvidia ]; then echo "soort=nvidia" >> "$GITHUB_OUTPUT"; else echo "soort=main" >> "$GITHUB_OUTPUT"; fi

      - name: Inloggen bij GitHub Packages
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin --authfile /tmp/ghcr-auth.json
          sudo cp /tmp/ghcr-auth.json /run/containers/0/auth.json 2>/dev/null || true

      - name: BugOS ophalen
        id: ophalen
        run: |
          IMG="${{ steps.naam.outputs.image }}"
          sudo podman pull --authfile /tmp/ghcr-auth.json "$IMG"
          # De precieze versie (digest): de live-omgeving en de BugOS die erop
          # meegaat om te installeren moeten exact dezelfde zijn.
          echo "digest=$(sudo podman image inspect --format '{{ .Digest }}' "$IMG")" >> "$GITHUB_OUTPUT"

      - name: Live-omgeving bouwen
        run: |
          # --secret: het inlogbestand, zodat de bouw BugOS zelf op de stick kan zetten
          # (iso_live/src/build.sh stap 1). Het komt niet in de ISO terecht.
          sudo TMPDIR=/mnt/containers/tmp podman build \
            --cap-add sys_admin --security-opt label=disable --squash \
            --secret id=ghcr,src=/tmp/ghcr-auth.json \
            --build-arg BASE_IMAGE="${{ steps.naam.outputs.image }}" \
            --build-arg IMAGE_REF="${{ steps.naam.outputs.image }}" \
            --build-arg IMAGE_DIGEST="${{ steps.ophalen.outputs.digest }}" \
            --build-arg BUGOS_VARIANT="${{ steps.naam.outputs.soort }}" \
            -t localhost/bugos-live:latest iso_live
          df -h / /mnt /mnt/containers
          sudo btrfs filesystem df /mnt/containers || true
          sudo podman rmi "${{ steps.naam.outputs.image }}" || true
          sudo podman image prune -f || true
          df -h / /mnt /mnt/containers

      - name: ISO maken (Titanoboa)
        id: iso
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/bugos-live:latest

      - name: Naam en controlegetal
        id: klaar
        run: |
          mkdir -p uit
          NAAM="BugOS-${{ steps.naam.outputs.soort }}-${{ steps.naam.outputs.datum }}.iso"
          mv "${{ steps.iso.outputs.iso-dest }}" "uit/${NAAM}"
          (cd uit && sha256sum "${NAAM}" | tee "${NAAM}.sha256")
          ls -la uit
          echo "naam=${NAAM}" >> "$GITHUB_OUTPUT"

      - name: ISO klaarzetten om te downloaden (7 dagen)
        if: ${{ !inputs.publiceren }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.klaar.outputs.naam }}
          path: uit/
          retention-days: 7
          compression-level: 0

      - name: In stukjes knippen (max 2 GB per bestand)
        if: ${{ inputs.publiceren }}
        run: |
          cd uit
          NAAM="${{ steps.klaar.outputs.naam }}"
          split -b 1900M -d -a 2 "${NAAM}" "${NAAM}.deel"
          rm "${NAAM}"
          python3 - "$NAAM" <<'PY'
          import hashlib, json, pathlib, sys
          naam = sys.argv[1]
          delen = sorted(p for p in pathlib.Path(".").glob(naam + ".deel*"))
          info = {
              "naam": naam,
              "sha256": open(naam + ".sha256").read().split()[0],
              "delen": [{"bestand": p.name, "grootte": p.stat().st_size,
                         "sha256": hashlib.sha256(p.read_bytes()).hexdigest()} for p in delen],
          }
          pathlib.Path("bugos-iso.json").write_text(json.dumps(info, indent=2))
          print(json.dumps(info, indent=2))
          PY

      - name: Publiceren als GitHub Release
        if: ${{ inputs.publiceren }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: iso-${{ steps.naam.outputs.soort }}-${{ steps.naam.outputs.datum }}-${{ github.run_number }}
          name: BugOS ${{ steps.naam.outputs.soort }} ${{ steps.naam.outputs.datum }} (USB-stick)
          make_latest: false
          prerelease: true
          files: uit/*
          body: |
            BugOS voor op een USB-stick (${{ steps.naam.outputs.soort }}).

            **Makkelijkst:** gebruik BugOS Overstap op Windows. Die downloadt dit vanzelf en maakt de USB-stick.

            **Zelf doen:** download alle `.deel`-bestanden en plak ze aan elkaar:
            - Linux/macOS: `cat ${{ steps.klaar.outputs.naam }}.deel* > ${{ steps.klaar.outputs.naam }}`
            - Windows: `copy /b ${{ steps.klaar.outputs.naam }}.deel00 + ${{ steps.klaar.outputs.naam }}.deel01 + ... ${{ steps.klaar.outputs.naam }}`

            Controlegetal (SHA-256) staat in het `.sha256`-bestand.

  klassiek:
    if: inputs.soort == 'klassiek'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Ruimte maken op de bouwcomputer
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: ISO-instellingen invullen
        id: prep
        env:
          VARIANT: ${{ inputs.variant }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo "::error::Geen geldige bouw: $TAG"; exit 1; }
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${VARIANT}:${TAG}"
          sed "s|@IMAGE@|${IMAGE}|g" disk_config/iso.toml > /tmp/iso.toml
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "uid=$(id -u)" >> "$GITHUB_OUTPUT"
          echo "gid=$(id -g)" >> "$GITHUB_OUTPUT"

      - name: Inloggen bij GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: ISO bouwen
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: /tmp/iso.toml
          image: ${{ steps.prep.outputs.image }}
          chown: ${{ steps.prep.outputs.uid }}:${{ steps.prep.outputs.gid }}
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: ISO klaarzetten om te downloaden
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.variant }}-${{ inputs.tag }}-klassiek-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
