---
# De BugOS-website (map website/) online zetten via GitHub Pages.
# Eenmalig aanzetten: Settings -> Pages -> Source: "GitHub Actions".
name: Website

# Staat nu op handmatig. Automatisch maken: zet het "push"-blok hieronder terug.
on:
  workflow_dispatch:
#  push:
#    branches: [main]
#    paths: ["website/**", ".github/workflows/website.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  online:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deploy
        uses: actions/deploy-pages@v4
