<?xml version="1.0" encoding="UTF-8"?>
<!-- BugOS Plasma-stijl: lijnen. Gemaakt door tools/plasma/buttons.py; niet met de hand bewerken. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="3" height="1" viewBox="0 0 3 1">
    <defs>
    <style type="text/css" id="current-color-scheme">
        .ColorScheme-Text { color:#16171C; }
        .ColorScheme-Background { color:#F6F5F5; }
        .ColorScheme-ButtonFocus { color:#DE2F3E; }
        .ColorScheme-ButtonBackground { color:#F1EEEE; }
        .ColorScheme-ViewBackground { color:#FFFFFF; }
        .ColorScheme-Highlight { color:#FDE9E9; }
    </style>

    </defs>
    <rect id="vertical-line" x="0" y="0" width="1" height="1" class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.1"/>
    <rect id="horizontal-line" x="2" y="0" width="1" height="1" class="ColorScheme-Text" style="fill:currentColor;fill-opacity:0.1"/>
</svg>
