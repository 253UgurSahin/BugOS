# BugOS: de wortel (/) is een composefs-overlay die altijd alleen-lezen is (/usr/lib/ostree/prepare-root.conf).
# Het installatieprogramma (Anaconda) zet toch een regel voor / in /etc/fstab ("btrfs subvol=root,...,ro"), en
# systemd-remount-fs probeert / dan opnieuw te koppelen met die opties. Een composefs-overlay weigert dat
# ("overlay: No changes allowed in reconfigure"), dus stond deze dienst na elke start als mislukt in
# "systemctl --failed" en in "Er werkt iets niet". Opnieuw koppelen is hier ook nooit nodig: / blijft alleen-lezen,
# en /home, /var en /boot koppelt systemd gewoon zelf.
# Het minteken voor het programma: een mislukking telt niet als fout. De dienst doet verder precies hetzelfde
# (andere regels uit fstab, zoals /usr en de API-bestandssystemen, worden nog steeds opnieuw gekoppeld).
[Service]
ExecStart=
ExecStart=-/usr/lib/systemd/systemd-remount-fs
