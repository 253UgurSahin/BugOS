# BugOS: de systeemupdate elke dag op de klok, zoals de apps (U021). De standaard van rpm-ostree is "1 uur na het
# opstarten" en "1 dag na de vorige keer": die tijd telt niet door als een laptop slaapt, en wie de pc korter dan een
# uur aanzet, kreeg nooit een update (U443). Persistent: stond hij uit, dan zodra hij weer aan is.
[Timer]
OnBootSec=
OnUnitInactiveSec=
OnCalendar=daily
RandomizedDelaySec=30min
Persistent=true
