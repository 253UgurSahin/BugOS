# BugOS: de instellingen van BugOS voor Firefox (de Flatpak van Flathub), zie
# /usr/share/bugos/firefox-systemconfig/defaults/pref/bugos.js voor het waarom en de bronnen.
#
# Firefox als Flatpak leest de uitbreiding org.mozilla.firefox.systemconfig uit dit pad. /var hoort bij de computer
# (niet bij het beeld van BugOS), dus zetten we er bij elke start een verwijzing naar de map in /usr neer: zo komt een
# nieuwe versie van de instellingen vanzelf mee met een update van BugOS. L+ vervangt wat er al stond.
# x86_64/stable: de architectuur en de tak van Firefox op Flathub ('flatpak list --app --columns=application,arch,branch').
d /var/lib/flatpak/extension 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig 0755 root root -
d /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64 0755 root root -
L+ /var/lib/flatpak/extension/org.mozilla.firefox.systemconfig/x86_64/stable - - - - /usr/share/bugos/firefox-systemconfig
