# BugOS: het BugOS-inlogscherm (thema 'bugos') voor SDDM. SDDM staat in BugOS uit tot je hem kiest met
# 'sudo bugos-inlogscherm sddm' (proef, docs/STANDALONE.md); de standaard is Plasma Login.
[Theme]
Current=bugos
CursorTheme=breeze_cursors

# Op Wayland, met KWin als motor voor het inlogscherm (zoals KDE het aanraadt). Het pakket sddm-wayland-plasma zet
# hetzelfde; staat dat er niet, dan geldt dit.
[General]
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
